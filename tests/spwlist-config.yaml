add_cmd:
- module load Apptainer
slurm:
  cpus_per_task: 32
  mem: 256GB
  partition: public-cpu
  time: 2-1:00:00

caracal:
  mode: spwlist
  all:
    start-worker: prep
    transform-split_field-nthreads: 32
    flag:
      flag_quack:
        enable: true
        interval: 8.0
      flag_antennas:
        enable: true
        antennas: m011,m060,m018
      flag_scan:
        enable: true
        scans: 4,16,10

  runs:
  - label: band-01
    band: 0:0.5813~0.6985GHz
    options:
      flag:
        flag_manual:
        - "antenna:m001,m002,m003,m004 scan:12"
  - label: band-02
    band: 0:0.6985~0.8157GHz
    imports: [0]
  - label: band-03
    band: 0:0.8157~0.9329GHz
  - label: band-04
    band: 0:0.9647~1.045GHz
    options:
      start-worker: transform