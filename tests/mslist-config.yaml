add_cmd:
- module load Apptainer
slurm:
  cpus_per_task: 32
  mem: 256GB
  partition: public-cpu
  time: 2-1:00:00

caracal:
  mode: mslist
  all:
    start-worker: prep
    transform-split_field-nthreads: 32
    flag:
      flag_quack:
        enable: true
        interval: 8.0
      flag_antennas:
        enable: true
        antennas: m011,m060,m018
      flag_scan:
        enable: true
        scans: 4,16,10

  runs:
  - ms: dummy1.ms
    options:
      flag:
        flag_manual:
          rules:
          - "antenna:m001,m002,m003,m004 scan:12"
  - ms: dummy2.ms
    imports: [0]
  - ms: dummy3.ms
  - ms: dummy4.ms
    options:
      start-worker: transform      